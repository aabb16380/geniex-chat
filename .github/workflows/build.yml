name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再用 android-actions/setup-android@v3：它会安装已下线的 'tools' 包，
      # 在新版 cmdline-tools 上必然失败。GitHub 托管跑者自带 Android SDK，
      # 直接用 ANDROID_HOME 即可。
      - name: Point Gradle at the preinstalled Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT is not set on this runner"
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "Using SDK: $SDK"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
